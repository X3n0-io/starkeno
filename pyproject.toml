[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "starkeno"
dynamic = ["version"]
description = "Osservabilita' locale per il lavoro con gli agenti di codice"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Simone Mansella" }]
keywords = [
  "claude-code", "codex", "coding-agent", "observability", "cost", "tokens",
  "forecast", "preflight", "local-first", "privacy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Italian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "alembic>=1.13,<2",
  "anthropic>=0.122,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp[cli]>=2,<3",
  "sqlalchemy>=2,<3",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/X3n0-io/starkeno"
Repository = "https://github.com/X3n0-io/starkeno"
Changelog = "https://github.com/X3n0-io/starkeno/blob/main/CHANGELOG.md"
"Lo scarto 9x" = "https://github.com/X3n0-io/starkeno/blob/main/docs/lo-scarto-9x.md"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "pip-tools>=7.4,<8",
]

[project.scripts]
starkeno = "starkeno.cli:main"

[tool.hatch.version]
path = "starkeno/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["starkeno", "migrations"]

[tool.hatch.build.targets.wheel.force-include]
".codex-plugin" = "starkeno/plugin_bundle/.codex-plugin"
"hooks" = "starkeno/plugin_bundle/hooks"
"skills" = "starkeno/plugin_bundle/skills"
".claude-plugin" = "starkeno/plugin_bundle/.claude-plugin"
"plugin-claude-code" = "starkeno/plugin_bundle/plugin-claude-code"

[tool.hatch.build.targets.sdist]
include = [
  "/.codex-plugin",
  "/.claude-plugin",
  "/plugin-claude-code",
  "/hooks",
  "/skills",
  "/migrations",
  "/starkeno",
  "/LICENSE",
  "/README.md",
  "/alembic.ini",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
