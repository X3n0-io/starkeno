[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "starkeno"
dynamic = ["version"]
description = "Local observability for coding-agent workflows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Simone Mansella" }]
dependencies = [
  "alembic>=1.13,<2",
  "anthropic>=0.122,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp[cli]>=2,<3",
  "sqlalchemy>=2,<3",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "pip-tools>=7.4,<8",
]

[project.scripts]
starkeno = "starkeno.cli:main"

[tool.hatch.version]
path = "starkeno/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["starkeno", "migrations"]

[tool.hatch.build.targets.wheel.force-include]
".codex-plugin" = "starkeno/plugin_bundle/.codex-plugin"
"hooks" = "starkeno/plugin_bundle/hooks"
"skills" = "starkeno/plugin_bundle/skills"
".claude-plugin" = "starkeno/plugin_bundle/.claude-plugin"
"plugin-claude-code" = "starkeno/plugin_bundle/plugin-claude-code"

[tool.hatch.build.targets.sdist]
include = [
  "/.codex-plugin",
  "/.claude-plugin",
  "/plugin-claude-code",
  "/hooks",
  "/skills",
  "/migrations",
  "/starkeno",
  "/LICENSE",
  "/README.md",
  "/alembic.ini",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
