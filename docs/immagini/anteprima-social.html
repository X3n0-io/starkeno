<!doctype html><html lang="it"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1280px;height:640px;background:#101216;color:#f3f4f6;
       font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;
       justify-content:center;padding:0 84px;overflow:hidden}
  .marchio{color:#8e98a8;font-size:26px;letter-spacing:.14em;text-transform:uppercase;
           margin-bottom:26px}
  h1{font-size:64px;line-height:1.1;font-weight:700;letter-spacing:-.02em;max-width:1040px}
  h1 em{font-style:normal;color:#a9b7d0}
  .cifre{display:flex;align-items:flex-end;gap:38px;margin:44px 0 38px}
  .box{background:#161a20;border:1px solid #1a1e25;border-radius:14px;padding:20px 28px}
  .box .et{color:#8e98a8;font-size:20px;margin-bottom:8px}
  .box .nu{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
  .scarto{font-size:76px;font-weight:800;color:#f3f4f6;line-height:1;padding-bottom:6px}
  .scarto small{display:block;font-size:19px;font-weight:400;color:#8e98a8;
                letter-spacing:.05em;margin-top:10px}
  .piede{display:flex;justify-content:space-between;align-items:center;
         border-top:1px solid #1a1e25;padding-top:26px;color:#b7beca;font-size:23px}
  .piede b{color:#f3f4f6;font-weight:600}
</style></head><body>
  <div class="marchio">StarkEno</div>
  <h1>Quanto costerà un lavoro con Claude&nbsp;Code o Codex,<br><em>prima di lanciarlo.</em></h1>
  <div class="cifre">
    <div class="box"><div class="et">previsto</div><div class="nu">331.500</div></div>
    <div class="box"><div class="et">osservato</div><div class="nu">3.035.535</div></div>
    <div class="scarto">9,15×<small>e il progetto dice perché</small></div>
  </div>
  <div class="piede">
    <span><b>github.com/X3n0-io/starkeno</b></span>
    <span>Tutto locale · niente rete · niente account · MIT</span>
  </div>
</body></html>
