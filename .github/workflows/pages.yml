# Pubblica `sito/` su GitHub Pages.
#
# Il sito e' due pagine — italiano e inglese — senza build e senza dipendenze: nessun
# generatore statico, nessun npm, nessun font o script da CDN. Le uniche richieste che fa
# il visitatore sono le immagini ospitate su GitHub, e un sito che traccia chi lo legge
# smentirebbe la promessa che il progetto fa a chi lo installa.
#
# Il deploy passa da un workflow invece che dal ramo `gh-pages`: cosi' `main` resta
# l'unica storia e non c'e' un secondo ramo da tenere allineato a mano.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "sito/**"
      - "scripts/verifica_sito.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta, senza annullare quello in corso: interrompere una pubblicazione
# a meta' lascerebbe il sito in uno stato che nessuno ha scelto.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Il sito non deve far scaricare niente da terzi
        run: python scripts/verifica_sito.py sito
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - id: deploy
        uses: actions/deploy-pages@v4
