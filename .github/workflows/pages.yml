# Pubblica `sito/` su GitHub Pages.
#
# Il sito e' una pagina sola, senza build e senza dipendenze: nessun generatore statico,
# nessun npm, nessun font o script da CDN. Le uniche richieste che fa il visitatore sono
# le due immagini ospitate su GitHub — un sito che traccia chi lo legge smentirebbe la
# promessa che il progetto fa a chi lo installa.
#
# Il deploy passa da un workflow invece che dal ramo `gh-pages`: cosi' `main` resta
# l'unica storia e non c'e' un secondo ramo da tenere allineato a mano.

name: Pages

on:
  push:
    branches: [main]
    paths: ["sito/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta, senza annullare quello in corso: interrompere una pubblicazione
# a meta' lascerebbe il sito in uno stato che nessuno ha scelto.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Il sito non deve dipendere da terze parti
        run: |
          python - <<'PY'
          import pathlib, re, sys
          testo = pathlib.Path("sito/index.html").read_text(encoding="utf-8")
          host = {m.split("/")[0] for m in re.findall(r"https?://([^\"')\s]+)", testo)}
          ammessi = {"github.com", "raw.githubusercontent.com"}
          estranei = sorted(host - ammessi)
          if estranei:
              sys.exit("il sito contatta host non ammessi: %r" % estranei)
          print("host contattati:", sorted(host))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - id: deploy
        uses: actions/deploy-pages@v4
